<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSTAR 庫存管理系統</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <!-- Tesseract OCR SDK -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f5f5f5; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .section { margin-top: 20px; padding: 15px; border: 1px solid #e0e0e0; border-radius: 6px; }
        .upload-area { border: 2px dashed #ccc; padding: 20px; text-align: center; cursor: pointer; background: #fafafa; }
        .grid-preview { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
        .card-item { border: 1px solid #ccc; padding: 10px; width: 180px; background: #fff; border-radius: 4px; text-align: center; }
        .card-item img { max-width: 100%; height: auto; display: block; margin: 0 auto 5px; }
        button { cursor: pointer; padding: 8px 12px; border: none; background-color: #007bff; color: white; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>MSTAR 庫存管理與辨識系統</h2>
        <div>
            <span id="user-status">未登入</span>
            <button id="login-btn" onclick="handleGoogleLogin()">Google 登入</button>
        </div>
    </div>

    <!-- 截圖上傳與辨識區 -->
    <div class="section">
        <h3>截圖辨識與記憶</h3>
        <div class="upload-area" onclick="document.getElementById('file-input').click()">
            <p>點擊上傳或拖拽遊戲截圖至此</p>
            <input type="file" id="file-input" accept="image/*" style="display:none;" onchange="processScreenshot(event)">
        </div>
        <div id="status-msg" style="margin-top:10px; color:#666;"></div>
        <div id="cards-container" class="grid-preview"></div>
    </div>
</div>

<script>
    // --- 1. 安全防護腳本 (防護 local-storage / coiHeaders 崩潰) ---
    (function initSafetyGuards() {
        try {
            // 防御性設置，避免 null 屬性賦值錯誤
            window.coiHeaders = window.coiHeaders || {};
        } catch (e) {
            console.warn("初始化防護機制提醒:", e);
        }
    })();

    // --- 2. Firebase 初始化設定 ---
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    // 請替換上方 firebaseConfig 為您實際的 Firebase 專案設定
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let itemMemoryCache = []; // 本地記憶庫快取

    // 監聽登入狀態
    auth.onAuthStateChanged(user => {
        currentUser = user;
        const statusEl = document.getElementById('user-status');
        const loginBtn = document.getElementById('login-btn');
        if (user) {
            statusEl.innerText = `已登入: ${user.displayName || user.email}`;
            loginBtn.innerText = "登出";
            loginBtn.onclick = () => auth.signOut();
            loadItemMemory(); // 登入成功後載入記憶庫
        } else {
            statusEl.innerText = "未登入";
            loginBtn.innerText = "Google 登入";
            loginBtn.onclick = handleGoogleLogin;
            itemMemoryCache = [];
        }
    });

    async function handleGoogleLogin() {
        const provider = new firebase.auth.GoogleAuthProvider();
        try {
            await auth.signInWithPopup(provider);
        } catch (error) {
            console.error("Google 登入失敗:", error);
            alert("登入失敗，請確認未關閉驗證視窗！");
        }
    }

    // --- 3. 載入雲端商品特徵記憶庫 ---
    async function loadItemMemory() {
        if (!currentUser) return;
        try {
            const snapshot = await db.collection("itemMemory").get();
            itemMemoryCache = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            console.log(`成功載入 ${itemMemoryCache.length} 筆商品記憶資料`);
        } catch (err) {
            console.error("載入記憶庫失敗:", err);
        }
    }

    // --- 4. 處理截圖與自動分析 (包含尺寸過濾保護) ---
    async function processScreenshot(event) {
        const file = event.target.files[0];
        if (!file) return;

        const statusEl = document.getElementById('status-msg');
        const container = document.getElementById('cards-container');
        container.innerHTML = '';
        statusEl.innerText = '正在處理與分析截圖...';

        const img = new Image();
        img.src = URL.createObjectURL(file);
        await img.decode();

        // 模擬網格切割 (inferCardGrid 邏輯，增加尺寸檢查)
        const cards = sliceGridImage(img);
        
        statusEl.innerText = `辨識完成，共切出 ${cards.length} 個有效道具卡片。`;

        cards.forEach((cardCanvas, index) => {
            // 比對記憶庫
            const bestMatch = findBestMatch(cardCanvas);
            
            const cardDiv = document.createElement('div');
            cardDiv.className = 'card-item';
            
            const imgEl = document.createElement('img');
            imgEl.src = cardCanvas.toDataURL();
            
            const inputEl = document.createElement('input');
            inputEl.type = 'text';
            inputEl.placeholder = '請輸入商品名稱';
            inputEl.value = bestMatch ? bestMatch.name : '';
            
            const saveBtn = document.createElement('button');
            saveBtn.innerText = '手動儲存記憶';
            saveBtn.style.marginTop = '5px';
            saveBtn.onclick = () => saveSingleItemMemory(inputEl.value, cardCanvas);

            cardDiv.appendChild(imgEl);
            cardDiv.appendChild(inputEl);
            cardDiv.appendChild(saveBtn);
            container.appendChild(cardDiv);
        });
    }

    // --- 5. 網格切圖 (加裝尺寸防護機制，防止 2px 切圖) ---
    function sliceGridImage(sourceImg) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = sourceImg.width;
        canvas.height = sourceImg.height;
        ctx.drawImage(sourceImg, 0, 0);

        const cardCanvases = [];
        
        // 假設標準 4 欄網格切割 (示範計算)
        const cols = 4;
        const rows = 2;
        const cellWidth = Math.floor(canvas.width / cols);
        const cellHeight = Math.floor(canvas.height / rows);

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const x = c * cellWidth;
                const y = r * cellHeight;

                // 🛡️ 核心修復：防止裁切出來的寬高過小 (例如 2px / 0px) 傳入 Tesseract/Feature Engine
                if (cellWidth < 15 || cellHeight < 15) {
                    console.warn(`跳過過小的無效區塊: (${cellWidth}x${cellHeight})`);
                    continue;
                }

                const cardCanvas = document.createElement('canvas');
                cardCanvas.width = cellWidth;
                cardCanvas.height = cellHeight;
                const cardCtx = cardCanvas.getContext('2d');
                cardCtx.drawImage(canvas, x, y, cellWidth, cellHeight, 0, 0, cellWidth, cellHeight);
                
                cardCanvases.push(cardCanvas);
            }
        }
        return cardCanvases;
    }

    // --- 6. 圖像特徵比對邏輯 ---
    function findBestMatch(cardCanvas) {
        if (!itemMemoryCache.length) return null;
        
        const targetSig = getSimpleSignature(cardCanvas);
        let bestMatch = null;
        let minDiff = 0.28; // 比對閾值 (可調整)

        for (const item of itemMemoryCache) {
            if (!item.signature) continue;
            const diff = compareSignatures(targetSig, item.signature);
            if (diff < minDiff) {
                minDiff = diff;
                bestMatch = item;
            }
        }
        return bestMatch;
    }

    // --- 7. 手動儲存商品特徵至 Firestore ---
    async function saveSingleItemMemory(name, cardCanvas) {
        if (!name.trim()) {
            alert("請輸入商品名稱！");
            return;
        }
        if (!currentUser) {
            alert("請先登入 Google 帳號後再儲存記憶！");
            return;
        }

        // 🛡️ 保護：檢查圖片尺寸是否合規
        if (cardCanvas.width < 15 || cardCanvas.height < 15) {
            alert("圖片尺寸過小，無法建立特徵記憶！");
            return;
        }

        const signature = getSimpleSignature(cardCanvas);
        const itemData = {
            name: name.trim(),
            signature: signature,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        try {
            await db.collection("itemMemory").add(itemData);
            alert(`成功記憶商品：「${name}」！`);
            loadItemMemory(); // 重新整理本地快取
        } catch (err) {
            console.error("寫入 Firestore 失敗:", err);
            alert("儲存失敗，請檢查網路或權限！");
        }
    }

    // 簡化版特徵計算範例 (色彩與像素簽章)
    function getSimpleSignature(canvas) {
        const ctx = canvas.getContext('2d');
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        let r = 0, g = 0, b = 0, count = 0;
        for (let i = 0; i < imgData.length; i += 16) { // 抽樣計算
            r += imgData[i];
            g += imgData[i+1];
            b += imgData[i+2];
            count++;
        }
        return [Math.round(r/count), Math.round(g/count), Math.round(b/count)];
    }

    function compareSignatures(sig1, sig2) {
        const dist = Math.sqrt(
            Math.pow(sig1[0] - sig2[0], 2) +
            Math.pow(sig1[1] - sig2[1], 2) +
            Math.pow(sig1[2] - sig2[2], 2)
        );
        return dist / 441.67; // 歸一化 0~1 數值
    }
</script>

</body>
</html>
