<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🤎內內的小倉倉🤎</title>
<style>
:root{--bg:#f3ebe4;--p:#fffaf6;--line:#d9c1b0;--text:#4d392f;--muted:#8d7467;--a:#b78167}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#f8f2ed,#eee1d7);color:var(--text);font-family:system-ui,"Microsoft JhengHei",sans-serif}button,input{font:inherit}.wrap{max-width:1050px;margin:auto;padding:22px}h1{margin:0;font-size:25px}header p{margin:5px 0 18px;color:var(--muted)}.box,.panel,.stat{background:var(--p);border:1px solid var(--line);border-radius:20px}.box{padding:17px}.search{display:flex;gap:9px}.search input{flex:1;padding:13px;border:1px solid var(--line);border-radius:13px}.btn{border:0;border-radius:12px;padding:11px 14px;background:#e5d3c6;color:var(--text);font-weight:700;cursor:pointer}.primary{background:var(--a);color:#fff}.danger{background:#efd6d3;color:#914f4b}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat{padding:14px}.stat small{color:var(--muted)}.stat b{display:block;font-size:22px;margin-top:4px}.main{display:grid;grid-template-columns:230px 1fr;gap:14px}.panel{padding:15px}.head{display:flex;justify-content:space-between;align-items:center}.accounts{display:flex;flex-direction:column;gap:7px}.acc{padding:10px;border-radius:11px;background:#f0e3d9;cursor:pointer;display:flex;justify-content:space-between}.acc.active{background:var(--a);color:white}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.genderTabs{display:flex;gap:7px;flex-wrap:wrap;margin:7px 0 0}.genderTab.active{background:var(--a);color:#fff}.categoryTabs{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.catTab{padding:8px 12px}.catTab.active{background:var(--a);color:#fff}.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text)}.items{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.item{border:1px solid #e1ccbd;border-radius:15px;padding:12px;background:#fff;display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center}.thumb{width:58px;height:58px;border-radius:11px;background:#eadfd7;display:grid;place-items:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.recCard{display:grid;grid-template-columns:74px 1fr 46px;gap:8px;align-items:center;margin:8px 0;padding:8px;border:1px solid #e1ccbd;border-radius:13px;background:#fff}.recPic{width:74px;height:74px;border-radius:10px;object-fit:cover;background:#e8ddd5}.recFields{display:grid;grid-template-columns:1fr 90px;gap:6px}.cropNote{font-size:11px;color:var(--muted);margin-top:3px}.item h3{font-size:14px;margin:0 0 4px}.meta{font-size:12px;color:var(--muted)}.qty{font-size:19px;font-weight:800;color:#986650}.itemActions{display:flex;flex-direction:column;gap:5px;align-items:flex-end}.mini{border:0;border-radius:8px;padding:5px 7px;cursor:pointer;background:#eadbd0;color:#6b5145;font-size:11px}.mini.del{background:#f2dcda;color:#984f4b}.empty{padding:35px 8px;text-align:center;color:var(--muted)}#results{display:none;margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}.row{display:flex;justify-content:space-between;padding:7px 2px}.total{font-weight:800;color:#986650;margin-top:8px}dialog{width:min(430px,92vw);border:1px solid var(--line);border-radius:18px;background:var(--p);padding:20px;color:var(--text)}dialog::backdrop{background:#3c2c2866}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px}.actions{display:flex;justify-content:flex-end;gap:7px;margin-top:15px}.note{font-size:12px;color:var(--muted);margin-top:15px}
@media(max-width:700px){.wrap{padding:13px}.stats{grid-template-columns:repeat(2,1fr)}.main{grid-template-columns:1fr}.accounts{flex-direction:row;overflow:auto}.acc{min-width:100px}.items{grid-template-columns:1fr}}
#shotDlg{
 width:min(1180px,94vw);
 max-width:none;
 height:min(860px,92vh);
 max-height:92vh;
 padding:22px;
 overflow:auto;
}
#shotDlg #shotImg{max-height:420px!important}
#shotDlg #recognized{max-height:none}
@media(max-width:700px){
 #shotDlg{width:96vw;height:94vh;max-height:94vh;padding:14px}
 #shotDlg #shotImg{max-height:300px!important}
}
#authGate{position:fixed;inset:0;z-index:9999;background:linear-gradient(#f8f2ed,#eee1d7);display:grid;place-items:center;padding:20px}
#authGate .loginCard{width:min(430px,92vw);background:var(--p);border:1px solid var(--line);border-radius:22px;padding:28px;text-align:center;box-shadow:0 18px 55px #6d514322}
#authGate h2{margin:0 0 8px}#authGate p{color:var(--muted);margin:0 0 18px}.hidden{display:none!important}
#app{visibility:hidden}
.authbar{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:10px;font-size:12px;color:var(--muted)}
</style></head><body>
<div id="authGate"><div class="loginCard"><h2>🤎內內的小倉倉🤎</h2><p>請先使用你的 Google 帳號登入</p><button class="btn primary" id="googleLogin">使用 Google 登入</button><div id="loginMsg" class="note"></div></div></div>
<div id="app"><div class="wrap">
<div class="authbar"><span id="userLabel"></span><button class="mini" id="logout">登出</button></div><header><h1>🤎內內的小倉倉🤎</h1><p>庫存管理</p></header>
<section class="box"><div class="search"><input id="q" placeholder="搜尋物品，例如：珊瑚、藤編、粉色…"><button class="btn primary" id="go">搜尋</button></div><div id="grandTotal" class="stat" style="display:none;margin-top:12px"></div><div id="results"></div></section>
<div class="stats"><div class="stat"><small>帳號數</small><b id="sa">0</b></div><div class="stat"><small>物品種類</small><b id="sk">0</b></div><div class="stat"><small>庫存總數</small><b id="sq">0</b></div><div class="stat"><small>最近更新</small><b id="su" style="font-size:13px">尚未</b></div></div>
<div class="main"><aside class="panel"><div class="head"><h3>帳號</h3><button class="btn" id="newA">＋</button></div><div class="accounts" id="accounts"></div></aside>
<main class="panel"><div class="toolbar"><button class="btn primary" id="newI">＋ 新增物品</button><button class="btn" id="importShot">📷 匯入截圖</button></div><div class="head"><h3 id="title">請先選擇帳號</h3><button class="btn" id="editAccount" style="display:none">✏️ 修改帳號</button><button class="btn danger" id="deleteAccount" style="display:none">🗑 刪除此帳號</button></div><div class="categoryTabs">
<button class="btn primary catTab active" data-cat="家具">家具</button>
<button class="btn catTab" data-cat="玩偶">玩偶</button>
<button class="btn catTab" data-cat="花盆">花盆</button>
<button class="btn catTab" data-cat="戒指">戒指</button>
<button class="btn catTab" data-cat="作物">作物</button>
<button class="btn catTab" data-cat="寵物">寵物</button>
<button class="btn catTab" data-cat="材料">材料</button>
</div>
<div class="genderTabs" id="genderTabs" style="display:none">

<button class="btn genderTab" data-gender="限男">限男</button>
<button class="btn genderTab" data-gender="限女">限女</button>
</div>
<div class="items" id="items"></div><div class="note">資料會儲存在你的 Firebase Firestore；只有指定的 Google 帳號可讀寫。</div></main></div></div></div>
<dialog id="editAd"><div class="modal"><h3>修改帳號</h3><div class="field"><label>編號</label><input id="ean" placeholder="例如：457"></div><div class="field"><label>ID</label><input id="eid" placeholder="遊戲 ID"></div><div class="actions"><button class="btn" onclick="editAd.close()">取消</button><button class="btn primary" id="eas">儲存</button></div></div></dialog><dialog id="ad"><h3>新增帳號</h3><div class="field"><label>帳號名稱／編號</label><input id="an" placeholder="例如：457"></div><div class="actions"><button class="btn" onclick="ad.close()">取消</button><button class="btn primary" id="as">新增</button></div></dialog>
<dialog id="editItemDlg"><div class="modal">
<h3>修改道具</h3>
<div class="field"><label>名稱</label><input id="editItemName"></div>
<div class="field"><label>分類</label><select id="editItemCat">
<option value="家具">家具</option>
<option value="玩偶">玩偶</option>
<option value="花盆">花盆</option>
<option value="戒指">戒指</option>
<option value="作物">作物</option>
<option value="寵物">寵物</option>
<option value="材料">材料</option>
</select></div>
<div class="field" id="editItemGenderField"><label>限制</label><select id="editItemGender">
<option value="限男">限男</option><option value="限女">限女</option>
</select></div>
<div class="field"><label>款式／顏色</label><input id="editItemVariant"></div>
<div class="field"><label>數量</label><input id="editItemQty" type="number" min="1"></div>
<div class="actions"><button class="btn" id="editItemCancel">取消</button><button class="btn primary" id="editItemSave">儲存修改</button></div>
</div></dialog><dialog id="idg"><h3>新增物品</h3><div class="field"><label>物品名稱</label><input id="in" placeholder="例如：海底珊瑚拍照區"></div><div class="field"><label>分類</label><select id="ic">
<option value="家具">家具</option>
<option value="玩偶">玩偶</option>
<option value="花盆">花盆</option>
<option value="戒指">戒指</option>
<option value="作物">作物</option>
<option value="寵物">寵物</option>
<option value="材料">材料</option>
</select></div>
<div class="field" id="genderField"><label>限制</label><select id="ig">
<option value="限男">限男</option>
<option value="限女">限女</option>
</select></div><div class="field"><label>款式</label><input id="iv" placeholder="例如：綠"></div><div class="field"><label>數量</label><input id="iq" type="number" min="1" value="1"></div><div class="actions"><button class="btn" onclick="idg.close()">取消</button><button class="btn primary" id="is">加入庫存</button></div></dialog>
<dialog id="shotDlg"><h3>📷 匯入 MSTAR 庫存截圖</h3>
<div class="field"><label>目前要加入哪個帳號</label><div id="shotAccount" style="font-weight:800;padding:8px 0"></div></div>
<div id="dropShot" style="border:2px dashed var(--line);border-radius:16px;padding:24px;text-align:center;background:#fff;cursor:pointer">把庫存截圖拖到這裡<br><span class="meta">或點一下選擇 JPG / PNG</span><input id="shotFile" type="file" accept="image/*" hidden></div>
<div id="shotPreview" style="display:none;margin-top:12px"><img id="shotImg" style="width:100%;max-height:240px;object-fit:contain;border-radius:12px;background:#ddd"><div class="note">依 MSTAR 固定道具卡片版型辨識；只讀道具名稱區，不把「查看詳情」、NEW、頁碼等介面文字當成道具。少量或多量道具都可辨識。</div>
<div style="margin-top:10px;font-weight:800">辨識確認</div><div id="recognized" style="margin-top:8px"></div></div>
<div class="actions"><button class="btn" onclick="shotDlg.close()">取消</button><button class="btn primary" id="mockRecognize">辨識這張截圖</button><button class="btn primary" id="confirmRecognized" style="display:none">確認加入庫存</button></div></dialog>
